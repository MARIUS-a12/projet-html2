<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Contactez John Doe grâce au formulaire de cette page.">
  <title>Contact | John Doe</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="index.html">John Doe</a>
    <nav aria-label="Navigation principale"><ul class="nav-list">
      <li><a href="index.html">Accueil</a></li><li><a href="a_propos.html">À propos</a></li><li><a class="active" aria-current="page" href="contact.html">Contact</a></li>
    </ul></nav>
  </header>
  <main class="container page-content">
    <section class="card form-card">
      <p class="eyebrow">Restons en contact</p>
      <h1>Envoyez-moi un message</h1>
      <p>Une question ou une idée de projet ? Remplissez le formulaire ci-dessous.</p>
      <form action="#" method="post">
        <div class="form-grid">
          <div class="field"><label for="fullname">Nom complet</label><input type="text" id="fullname" name="fullname" autocomplete="name" required></div>
          <div class="field"><label for="email">Adresse e-mail</label><input type="email" id="email" name="email" autocomplete="email" required></div>
          <div class="field"><label for="birth">Date de naissance <span class="optional">(facultatif)</span></label><input type="date" id="birth" name="birth"></div>
          <div class="field"><label for="country">Pays</label><select id="country" name="country"><option value="">Choisir un pays</option><option value="cote-ivoire">Côte d'Ivoire</option><option value="senegal">Sénégal</option><option value="france">France</option></select></div>
        </div>
        <fieldset><legend>Vos compétences <span class="optional">(facultatif)</span></legend><div class="choice-list">
          <label><input type="checkbox" name="skills" value="html"> HTML</label><label><input type="checkbox" name="skills" value="css"> CSS</label><label><input type="checkbox" name="skills" value="javascript"> JavaScript</label><label><input type="checkbox" name="skills" value="python"> Python</label>
        </div></fieldset>
        <div class="field"><label for="message">Votre message</label><textarea id="message" name="message" rows="5" required></textarea></div>
        <button class="button" type="submit">Envoyer le message</button>
      </form>
    </section>
  </main>
  <footer class="site-footer"><p>© 2026 John Doe · <a href="index.html">Retour à l'accueil</a></p></footer>
</body>
</html>
